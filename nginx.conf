server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  location /health {
    default_type application/json;
    return 200 '{"ok":true}';
  }

  location / {
    try_files $uri $uri/ /index.html =404;
  }

  location ~* \.(css|js|jpg|jpeg|png|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
